<?xml version="1.0" encoding="UTF-8"?>
<!-- Tachocline Industries logo master. Traced from draft v1 (AI-generated
     Grok Bot, 2026-10-29) into SVG by Cursor agent for Howard Isaacson.
     Palette sampled from the draft: #000000, #621201, #9F2D01, #B54B0B,
     #D15D03, #FB930E. See LICENSE-ASSETS.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tachocline Industries">
  <title>Tachocline Industries</title>
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <radialGradient id="disk" cx="46%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FB930E"/>
      <stop offset="35%" stop-color="#D15D03"/>
      <stop offset="70%" stop-color="#9F2D01"/>
      <stop offset="100%" stop-color="#621201"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FB930E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D15D03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB930E"/>
      <stop offset="55%" stop-color="#D15D03"/>
      <stop offset="100%" stop-color="#621201"/>
    </linearGradient>
  </defs>

  <!-- Coronal loops / prominences (behind the disk) -->
  <g fill="none" stroke="url(#loop)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 210 C 70 40, 250 -10, 310 150" stroke-width="18" opacity="0.95"/>
    <path d="M200 175 C 120 20, 340 5, 345 175" stroke-width="12" opacity="0.85"/>
    <path d="M330 165 C 420 40, 500 160, 390 250" stroke-width="16" opacity="0.9"/>
    <path d="M355 200 C 470 110, 505 230, 400 285" stroke-width="10" opacity="0.75"/>
    <path d="M150 280 C 40 250, 55 420, 200 390" stroke-width="14" opacity="0.85"/>
    <path d="M175 320 C 60 360, 120 470, 240 410" stroke-width="9" opacity="0.7"/>
    <path d="M340 340 C 430 390, 390 490, 280 430" stroke-width="13" opacity="0.8"/>
    <path d="M300 360 C 380 430, 320 495, 250 440" stroke-width="8" opacity="0.65"/>
  </g>

  <!-- Photosphere -->
  <circle cx="256" cy="270" r="118" fill="url(#disk)"/>
  <circle cx="256" cy="270" r="118" fill="url(#core)"/>

  <!-- Limb brightening ring -->
  <circle cx="256" cy="270" r="118" fill="none" stroke="#FB930E" stroke-width="3" opacity="0.55"/>

  <!-- Sunspots / magnetic knots -->
  <g fill="#3A0A00" opacity="0.85">
    <ellipse cx="220" cy="250" rx="14" ry="11"/>
    <ellipse cx="288" cy="295" rx="18" ry="13"/>
    <ellipse cx="250" cy="318" rx="9" ry="7"/>
    <ellipse cx="305" cy="248" rx="8" ry="6"/>
  </g>
  <g fill="#621201" opacity="0.7">
    <ellipse cx="220" cy="250" rx="7" ry="5"/>
    <ellipse cx="288" cy="295" rx="9" ry="6"/>
  </g>

  <!-- Small plage highlights -->
  <g fill="#FB930E" opacity="0.45">
    <ellipse cx="235" cy="230" rx="16" ry="8"/>
    <ellipse cx="275" cy="255" rx="12" ry="6"/>
  </g>
</svg>
