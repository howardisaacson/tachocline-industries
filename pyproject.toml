# Ruff and pytest settings. ti_ingest is not an installed distribution:
# tests import it by putting ingest/ on pythonpath. The Docker image
# copies that directory. Tool versions are pinned in requirements-dev.txt
# so a laptop and GitHub Actions match.

[tool.ruff]
target-version = "py312"
# The plan generator predates the formatter. Checking it in would be a
# rewrite of tools/gh-setup/build_plan.py, which is a different change.
extend-exclude = ["tools/gh-setup"]

[tool.ruff.lint.isort]
known-first-party = ["ti_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ingest"]
