# Ruff and pytest settings. There is no installable package yet;
# ingest/ and api/ arrive in later phases. Tool versions are pinned
# in requirements-dev.txt so a laptop and GitHub Actions match.

[tool.ruff]
target-version = "py312"
# The plan generator predates the formatter. Checking it in would be a
# rewrite of tools/gh-setup/build_plan.py, which is a different change.
# New Python (tests/, and later ingest/ and api/) is included.
extend-exclude = ["tools/gh-setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
